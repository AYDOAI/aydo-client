<app-full-screen-content-wrapper>
  <ng-template #header>
    <app-header title="Devices"></app-header>
  </ng-template>
  <ng-template #content>
    <app-form
      [form]="form"
      [formGroup]="formGroup"
      [back]="'/devices/add'"
      (onClickButton)="button($event)">
    </app-form>
  </ng-template>
</app-full-screen-content-wrapper>
