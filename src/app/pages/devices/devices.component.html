<app-full-screen-content-wrapper
  [isRefreshable]="true"
  (refresh)="getDevices($event)">
  <ng-template #header>
    <app-header title="Devices"></app-header>
  </ng-template>
  <ng-template #content>
    <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
  </ng-template>
</app-full-screen-content-wrapper>

<ng-template #contentTemplate>
  <div class="devices">
    <div
      class="grid grid-cols-1 sm:grid-cols-1 md:grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4">
      <app-gateway-card (edit)="editHub()"></app-gateway-card>
    </div>
    <ng-container *ngIf="ui.devices">
      <div
        *ngIf="!ui.devices?.items?.length"
        class="grid grid-cols-1 sm:grid-cols-1 md:grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4">
        <div (click)="addDevice()" class="btn_new-device">
          <svg
            width="64"
            height="64"
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M32 0C29.7909 0 28 1.79086 28 4V28H4C1.79086 28 0 29.7909 0 32C0 34.2091 1.79086 36 4 36H28V60C28 62.2091 29.7909 64 32 64C34.2091 64 36 62.2091 36 60V36H60C62.2091 36 64 34.2091 64 32C64 29.7909 62.2091 28 60 28H36V4C36 1.79086 34.2091 0 32 0Z"
              fill="#99B859"
              fill-opacity="0.5" />
          </svg>
          <span>Add connectivity device</span>
        </div>
      </div>
      <div
        *ngIf="ui.devices && ui.devices.items?.length"
        class="grid grid-cols-1 sm:grid-cols-1 md:grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4">
        <button class="btn" [routerLink]="'/devices/add'">
          Add other device
          <svg-icon
            [name]="'plus'"
            class="icon"
            width="12px"
            height="12px"></svg-icon>
        </button>
      </div>
      <div
        *ngIf="ui.devices && ui.devices.items?.length"
        class="devices-list grid grid-cols-1 sm:grid-cols-1 md:grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4">
        <app-device-card
          *ngFor="let device of ui.devices.items"
          [device]="device"
          (edit)="edit($event)"></app-device-card>
      </div>
    </ng-container>
  </div>
</ng-template>
