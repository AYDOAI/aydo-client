<app-full-screen-content-wrapper
  [isRefreshable]="true"
  (refresh)="getDevices($event)">
  <ng-template #header>
    <app-header title="Devices"></app-header>
  </ng-template>
  <ng-template #content>
    <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
  </ng-template>
</app-full-screen-content-wrapper>

<ng-template #contentTemplate>
  <div class="devices">
      <div *ngIf="ui.gateway" class="card big device">
      <div class="card-content">
        <div class="device-header">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" style="min-width: 24px" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="12" fill="url(#paint0_radial_679_1618)"/>
            <defs>
              <radialGradient id="paint0_radial_679_1618" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                              gradientTransform="translate(12 12) rotate(90) scale(12)">
                <stop stop-color="#D5F790"/>
                <stop offset="1" stop-color="#D5F790" stop-opacity="0"/>
              </radialGradient>
            </defs>
          </svg>
          <div class="device-title-container">
            <div class="device-title">
              HUB: {{ ui.gateway?.identifier }}
            </div>
          </div>
        </div>
        <div class="device-capabilities">
            <div class="device-capability">
              <div class="device-capability-title">
                Status
              </div>
              <div class="device-capability-value">
                {{ ui.gateway?.is_online ? 'Online' : 'Offline' }}
              </div>
            </div>
        </div>
      </div>
    </div>
    <div *ngIf="!ui.devices?.items?.length" [routerLink]="'/add-device'" class="btn_new-device">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M32 0C29.7909 0 28 1.79086 28 4V28H4C1.79086 28 0 29.7909 0 32C0 34.2091 1.79086 36 4 36H28V60C28 62.2091 29.7909 64 32 64C34.2091 64 36 62.2091 36 60V36H60C62.2091 36 64 34.2091 64 32C64 29.7909 62.2091 28 60 28H36V4C36 1.79086 34.2091 0 32 0Z" fill="#99B859" fill-opacity="0.5"/>
      </svg>
      <span>Add connectivity device</span>
    </div>
    <div *ngIf="ui.devices && ui.devices.items?.length" class="devices-list">
      <button class="btn" [routerLink]="'/add-device'">
        Add other device
        <svg-icon [name]="'plus'" class="icon" width="12px" height="12px"></svg-icon>
      </button>
      <ng-container *ngFor="let device of ui.devices.items; trackBy: trackByIdent">
        <div class="card big device" [appRipple]="true" (click)="edit(device)">
          <div class="card-content">
            <div class="device-header">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" style="min-width: 24px" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="12" fill="url(#paint0_radial_679_1618)"/>
                <defs>
                  <radialGradient id="paint0_radial_679_1618" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                                  gradientTransform="translate(12 12) rotate(90) scale(12)">
                    <stop stop-color="#D5F790"/>
                    <stop offset="1" stop-color="#D5F790" stop-opacity="0"/>
                  </radialGradient>
                </defs>
              </svg>
              <div class="device-title-container">
                <div class="device-title">
                  {{device.name}}
                  <div *ngIf="device.zoneId" class="device-zone">
                    <div class="device-zone-value">
                      {{zoneName(device)}}
                    </div>
                  </div>
                </div>
                <svg-icon name="arrow" class="icon"></svg-icon>
              </div>
            </div>
            <div *ngIf="deviceCapabilitiesExists(device)" class="device-capabilities">
              <ng-container *ngFor="let capability of device.capabilities">
                <div class="device-capability" *ngIf="capability.value">
                  <div class="device-capability-title">
                    {{capability.displayName}}
                  </div>
                  <div class="device-capability-value">
                    {{capability.value ?? '-'}}{{capability.unit ?? ''}}
                  </div>
                </div>
              </ng-container>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</ng-template>
