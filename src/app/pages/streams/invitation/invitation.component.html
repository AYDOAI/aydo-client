<app-modal-wrapper *ngIf="isModal" title="Invitation">
  <ng-container
    *ngIf="stream$ | async as dataStream"
    [ngTemplateOutlet]="contentTemplate"
    [ngTemplateOutletContext]="{ dataStream }">
  </ng-container>
</app-modal-wrapper>

<app-full-screen-content-wrapper *ngIf="!isModal">
  <ng-template #header>
    <app-header title="Invitation" [back]="'/streams/' + id"></app-header>
  </ng-template>
  <ng-template #content>
    <ng-container
      *ngIf="stream$ | async as dataStream"
      [ngTemplateOutlet]="contentTemplate"
      [ngTemplateOutletContext]="{ dataStream }">
    </ng-container>
  </ng-template>
</app-full-screen-content-wrapper>

<ng-template #contentTemplate let-dataStream="dataStream">
  <div class="invitation" [class.mb-10]="isModal">
    <div class="card big">
      <div class="card-content">
        <div class="project-info">
          <div>
            <svg
              *ngIf="!dataStream?.logo"
              width="40"
              height="40"
              viewBox="0 0 40 40"
              fill="none">
              <circle
                cx="20"
                cy="20"
                r="19.7"
                fill="#EEF1E7"
                stroke="black"
                stroke-width="0.6" />
            </svg>
            <img
              *ngIf="dataStream?.logo"
              class="logo-image"
              src="{{ dataStream?.logo }}" />
          </div>
          <div class="project-content">
            <div class="card-header">
              <div class="card-title">
                <span class="title-text">{{ dataStream.name || '' }}</span>
              </div>
            </div>
            <div class="card-desc">
              {{ dataStream?.description ?? '' }}
            </div>
          </div>
        </div>

        <div class="invitation-content">
          <h3>This project requires an invitation</h3>
          <p>You need to be invited to participate in this project.</p>
          <app-input [title]="'Invite code'" [form]="form" [key]="'inviteCode'">
          </app-input>
          <div class="invitation-actions">
            <button
              class="btn text-center green-btn"
              (click)="submitInviteCode()"
              [disabled]="!form.valid">
              Submit Code
            </button>
            <button class="btn text-center" (click)="goBack()">Go Back</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
