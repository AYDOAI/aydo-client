<app-full-screen-content-wrapper>
  <ng-template #header>
    <app-header
      title="Connect devices"
      [back]="'/streams/' + (streamId$ | async)"></app-header>
  </ng-template>
  <ng-template #content>
    <div class="description">List of appropriate devices:</div>
    <div class="connect-devices">
      <ng-content *ngIf="(mergedDevices$ | async)?.length; else noDevices">
        @for (device of mergedDevices$ | async; track device.id) {
          <app-connect-card
            [device]="device"
            (toggleConnect)="onToggleConnection(device.id, device.connected)" />
        }
      </ng-content>
      <ng-template #noDevices
        >No suitable devices available for this data stream.</ng-template
      >
    </div>
  </ng-template>
</app-full-screen-content-wrapper>
