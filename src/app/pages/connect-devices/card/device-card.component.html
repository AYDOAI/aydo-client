<div class="card big">
  <div class="card-content">
    <div class="card-header">
      <div class="card-title">
        {{ device.name }}
      </div>
    </div>
    <button
      class="btn text-center"
      [class.red-btn]="!device.connected"
      (click)="toggleConnect.emit()">
      {{ device.connected ? 'Connected' : 'Disconnected' }}
    </button>
  </div>
</div>
