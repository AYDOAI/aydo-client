<div class="card big">
  <div class="card-content">
    <div class="card-header">
      <div class="card-title">
        {{ device.name }}
      </div>
    </div>
    <button
      class="btn text-center"
      [class.red-btn]="device.connected"
      (click)="toggleConnect.emit()">
      {{ device.connected ? 'Disconnect' : 'Connect' }}
    </button>
    <p class="addition-info">Total Approximate Payout per hour</p>
    <p class="tokens">12 tokens</p>
  </div>
</div>
