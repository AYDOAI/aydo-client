<app-modal-wrapper *ngIf="isModal" title="About">
  <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
</app-modal-wrapper>
<app-full-screen-content-wrapper *ngIf="!isModal">
  <ng-template #header>
    <app-header title="About"></app-header>
  </ng-template>
  <ng-template #content>
    <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
  </ng-template>
</app-full-screen-content-wrapper>

<ng-template #contentTemplate>
  <div class="about">
    <button
      class="btn"
      (click)="
        goToLink(
          'https://www.notion.so/aydo/Step-by-Step-Guide-for-Installing-AYDO-71d1156bdc8f40bebd9fc7f04f1526f9?pvs=4'
        )
      ">
      Step-by-Step Guide
    </button>

    <button
      class="btn"
      (click)="
        goToLink(
          'https://aydo.notion.site/Step-by-Step-Guide-to-Installing-the-AYDO-Desktop-Application-1f1bedb75fd080a097b0f58efd9fbb39'
        )
      ">
      Step-by-Step Guide to Installing the AYDO Desktop Application
    </button>

    <button class="btn" (click)="openLicense($event)">Privacy Policy</button>

    <div class="is-body-small txt-color-white56 txt-align-center">
      ---------- or reach us through ----------
    </div>

    <div class="social-grid w-full">
      <span></span>

        href="https://t.me/aydoai"
        target="_blank"
        class="social-wrap w-inline-block">

    <div class="tech-info">
      <p class="tech-item">
        Build version <span>{{ version }}</span>
      </p>
      <p class="tech-item">
        API Endpoint <span class="tech-value">{{ environment.main_url }}</span>
      </p>
