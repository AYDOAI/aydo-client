<app-modal-wrapper *ngIf="isModal" title="Profile">
  <app-form
    [form]="form"
    [formGroup]="formGroup"
    [showTitle]="false"
    (onClickButton)="button($event)"></app-form>
</app-modal-wrapper>

<app-full-screen-content-wrapper *ngIf="!isModal">
  <ng-template #header>
    <app-header title="Profile" back="/devices"></app-header>
  </ng-template>
  <ng-template #content>
    <app-form
      [form]="form"
      [formGroup]="formGroup"
      (onClickButton)="button($event)"></app-form>
  </ng-template>
</app-full-screen-content-wrapper>
