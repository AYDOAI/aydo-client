<app-full-screen-content-wrapper>
  <ng-template #header>
    <app-header title="Profile" back="/devices"></app-header>
  </ng-template>
  <ng-template #content>
    <app-form [form]="form"
              [formGroup]="formGroup"
              (onClickButton)="button($event)"></app-form>
  </ng-template>
</app-full-screen-content-wrapper>
