<div class="sign-in-buttons">
  <div *ngIf="signIn" class="button">
    <app-button
      [title]="'Sign in'"
      [border]="false"
      [arrow]="false"
      height="22px"
      (onClick)="goToSignIn()"></app-button>
  </div>
  <div *ngIf="signUp" class="button">
    <app-button
      [title]="'Sign up'"
      [border]="false"
      [arrow]="false"
      height="22px"
      (onClick)="goToSignUp()"></app-button>
  </div>
  <button
    *ngIf="demo"
    class="btn text-btn"
    (click)="ui.tryDemo()"
    [disabled]="ui.isBtnLoading('try_demo')">
    <span *ngIf="ui.isBtnLoading('try_demo')" class="spin-loader"></span>
    Try DEMO
  </button>
  <div *ngIf="forgot" class="button">
    <app-button
      [title]="'Forgot password?'"
      [border]="false"
      [arrow]="false"
      height="22px"
      (onClick)="goToForgotPassword()"></app-button>
  </div>
</div>
