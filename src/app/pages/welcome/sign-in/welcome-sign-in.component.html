<app-full-screen-content-wrapper>
  <ng-template #header>
    <ion-toolbar>
      <div class="header">
        <div class="title">Sign In</div>
      </div>
    </ion-toolbar>
  </ng-template>
  <ng-template #content>
    <div class="sign-in">
      <div class="sign-in__form">
        <div *ngIf="ui.clientWidth >= 768" class="header">
          <div class="title">Sign In</div>
        </div>
        <app-form
          [form]="form"
          [formGroup]="formGroup"
          [btnDisabled]="formGroup.invalid"
          (onClickButton)="button($event)"></app-form>
        <app-welcome-providers title="or sign in with"></app-welcome-providers>
        <app-welcome-navigate
          [signUp]="true"
          [demo]="true"
          [forgot]="true"></app-welcome-navigate>
      </div>
      <div *ngIf="ui.clientWidth >= 768" class="sign-in__logo"></div>
    </div>
  </ng-template>
</app-full-screen-content-wrapper>
