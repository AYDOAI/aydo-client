<app-full-screen-content-wrapper>
  <ng-template #header>
    <app-header title="Dashboard"></app-header>
  </ng-template>
  <ng-template #content>
    <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
  </ng-template>
</app-full-screen-content-wrapper>

<ng-template #contentTemplate>
  <div class="dashboard">
    <div class="item-row">
      <div
        class="dashboard-item main-quests card small"
        (click)="navigate('/quests')">
        <div class="dashboard-content card-content">
          <div class="title">
            Quests
            <svg-icon *ngIf="questsLength" name="arrow" class="icon"></svg-icon>
          </div>
          <div class="content">
            <span class="quest_count">{{ questsLength }}</span> active quests
          </div>
        </div>
      </div>
      <div
        class="dashboard-item rewards card small"
        (click)="navigate('/dashboard/rewards')">
        <div class="dashboard-content card-content">
          <div class="title">
            Rewards
            <svg-icon name="arrow" class="icon"></svg-icon>
          </div>
          <div class="content">
            <div class="points">
              <div class="reward-content">
                <div class="label">Earned:</div>
                <div class="reward-value">
                  <div>{{ ui.user?.balance || 0 }} Points</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="dashboard-item card long">
      <div class="card-content">
        <div class="card-header">
          <div class="card-title">Your referral link</div>
        </div>
        <div class="link-container">
          <a href="https://{{ refLink }}" target="_blank">{{ refLink }}</a>
          <svg
            (click)="copyRefLink($event)"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M4 4.5V3C4 1.89543 4.89543 1 6 1H15C16.1046 1 17 1.89543 17 3V12C17 13.1046 16.1046 14 15 14H13.6667M3 17H12C13.1046 17 14 16.1046 14 15V6C14 4.89543 13.1046 4 12 4H3C1.89543 4 1 4.89543 1 6V15C1 16.1046 1.89543 17 3 17Z"
              stroke="#A1AE84"
              stroke-width="2" />
          </svg>
        </div>
      </div>
    </div>
  </div>
</ng-template>
