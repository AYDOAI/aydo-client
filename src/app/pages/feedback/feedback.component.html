<app-full-screen-content-wrapper>
  <ng-template #header>
    <app-header title="Feedback"></app-header>
  </ng-template>
  <ng-template #content>
    <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
  </ng-template>
</app-full-screen-content-wrapper>

<ng-template #contentTemplate>
  <div class="about">
    <p>We value your feedback!</p>
    <p>
      Please submit any suggestions, issues, or bugs you encountered through our Discord channel for a rapid response,
      or use the feedback form below.
    </p>

    <button class="btn"
            (click)="goToLink('https://discord.com/channels/1196852834881253477/1310611376145829908')">
      Discord Chat
    </button>

    <button class="btn"
            (click)="goToLink('https://docs.google.com/forms/d/e/1FAIpQLSembw3ku4lDneeSxL0lH3yohGiFNW1o2M91pm09m9sN1p-hnQ/viewform')">
      Feedback Form
    </button>
  </div>
</ng-template>
