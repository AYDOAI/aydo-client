<div class="main" [class.no-padding]="platform.is('mobile')">
  <ion-app>
    <app-menu *ngIf="ui.appReady"></app-menu>
    <ion-router-outlet *ngIf="ui.appReady" id="main-content"></ion-router-outlet>
    <div *ngIf="loading.loading$ | async" class="loader-container">
      <span class="fence-loader"></span>
    </div>
  </ion-app>
</div>
<svg-definitions [style.display]="'none'"></svg-definitions>
<app-dialog-container></app-dialog-container>
<app-error></app-error>
