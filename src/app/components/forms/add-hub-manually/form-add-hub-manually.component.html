<app-modal-wrapper *ngIf="isModal" title="Add hub">
  <app-form
    [form]="form"
    [formGroup]="formGroup"
    [showTitle]="false"
    (onClickButton)="button($event)"
    back="add-hub"></app-form>
</app-modal-wrapper>
<app-content *ngIf="!isModal">
  <app-form
    [form]="form"
    [formGroup]="formGroup"
    (onClickButton)="button($event)"
    back="add-hub"></app-form>
</app-content>
