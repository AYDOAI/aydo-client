<app-modal-wrapper *ngIf="isModal" title="Add Hub">
  <app-form
    [form]="form"
    [formGroup]="formGroup"
    [btnDisabled]="formGroup.invalid"
    [showTitle]="false"
    back="add-hub"
    (onClickButton)="next()"></app-form>
</app-modal-wrapper>
<app-content *ngIf="!isModal">
  <app-form
    [form]="form"
    [formGroup]="formGroup"
    [btnDisabled]="formGroup.invalid"
    back="add-hub"
    (onClickButton)="next()"></app-form>
</app-content>
