<ion-menu slot="fixed" menuId="mainMenu" type="push" [contentId]="contentId" (ionWillClose)="menuService.menuActive = false" (ionWillOpen)="menuService.menuActive = true">
  <div class="menu-container">
    <div class="menu">
      <div class="menu-item" *ngFor="let item of menu" (click)="clickMenu(item)">
        <div class="menu-item-icon">
          <svg-icon class="icon" [name]="item.icon"></svg-icon>
        </div>
        <div class="menu-item-title">
          <div>{{item.title}}</div>
        </div>
      </div>
    </div>
  </div>
</ion-menu>
