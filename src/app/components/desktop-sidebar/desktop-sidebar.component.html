  <nav class="nav">
    <div *ngFor="let section of menu">
      <div class="section" *ngIf="section.items.length > 0">
        <p class="section-title">{{ section.type }}</p>
        <ul>
          <li
            *ngFor="let item of section.items"
            (click)="clickMenu(item)"
            class="menu-item"
            [class.active]="currentUrl === item.link">
            <div class="menu-item-icon">
              <svg-icon class="icon" [name]="item.icon"></svg-icon>
            </div>
            <div class="menu-item-title">
              <div>{{ item.title }}</div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="bottom">
    <div class="balance">
      <p class="label">Total Balance</p>
      <p class="amount">{{ ui.user?.balance }} Points</p>
    </div>
    <div class="profile" routerLink="/profile" [appRipple]="true">
      <app-avatar
        [key]="'avatar'"
        [readonly]="true"
        [imageUrl]="avatar$ | async" />
      <div class="info">
        <div class="name">{{ fullName$ | async }}</div>
        <div class="address">0x671....6063</div>
      </div>
      <svg-icon
        [name]="'arrow'"
        class="icon"
        width="12px"
        height="12px"></svg-icon>
    </div>
  </div>
</aside>
