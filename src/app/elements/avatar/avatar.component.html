<div class="avatar-container">
  <label for="avatarInput" class="avatar-label">
    <svg-icon height="42" width="27" *ngIf="!previewUrl" name="aydo-avatar" />
    <div class="avatar-preview" *ngIf="previewUrl">
      <img [src]="previewUrl" alt="Avatar Preview" class="avatar-image" />
      <button (click)="removeImage($event)" class="remove-button">
        &times;
      </button>
    </div>
  </label>
  <input
    id="avatarInput"
    type="file"
    (change)="onFileSelected($event)"
    accept="image/png, image/jpeg"
    hidden />
</div>
