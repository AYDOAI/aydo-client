server {
    listen 80;
    server_name localhost;

    
    root /usr/share/nginx/html;
    index index.html;

    
    location / {
        try_files $uri /index.html;
    }

    
    location /backend/ {
        proxy_pass http://aydo-cloud:3000;  
    }

    # Обработка ошибок
    error_page 404 /index.html;
}
